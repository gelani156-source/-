<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Radar">
<title>Money Radar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0B0E14; --card:#151C28; --btn:#1F2839; --text:#FFFFFF; --muted:#8E9CAE; --sub:#5F6D82;
  --blue:#5B8DEF; --green:#48D597; --red:#FF6B6B; --input:#101622; --progress:#1C2433; --line:rgba(255,255,255,.06);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
a{color:inherit;text-decoration:none}
button{border:0;background:none;color:inherit;font:inherit;cursor:pointer}
#app{width:100%;max-width:520px;padding:calc(14px + var(--sat)) 16px calc(92px + var(--sab));display:flex;flex-direction:column;gap:12px}
.header{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 2px}
.brand{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
.title{font-size:20px;font-weight:700;margin-top:2px}
.icon-btn{font-size:20px;padding:6px;border-radius:10px}
.back-btn{font-size:14px;color:var(--blue);font-weight:600;padding:6px 4px}
.card{background:var(--card);border-radius:16px;padding:16px;display:block}
a.card:active,.btn-action:active,.hist-item:active,.btn-save:active,.limit-card:active,.mini-card:active,.menu-item:active{transform:scale(.98);opacity:.85}
.card-label{font-size:12px;color:var(--muted);font-weight:500}
.balance-val{font-size:30px;font-weight:800;margin:6px 0;letter-spacing:-.5px}
.card-sublink{font-size:12px;color:var(--blue);font-weight:500}
.limits-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.limit-card{background:var(--card);border-radius:14px;padding:14px;display:block}
.limit-val{font-size:18px;font-weight:700;margin:4px 0 2px}
.limit-sub{font-size:10px;color:var(--sub)}
.section-label{font-size:12px;font-weight:600;color:var(--muted);margin:6px 2px 0}
.actions-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn-action{background:var(--btn);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.btn-icon{font-size:18px}.btn-text{font-size:11px;font-weight:600;text-align:center}
.mini-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mini-card{background:var(--card);border-radius:12px;padding:10px 8px;text-align:center;display:block}
.mini-title{font-size:10px;color:var(--muted);font-weight:600}
.mini-val{font-size:13px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-card{background:var(--card);border-radius:16px;padding:16px}
.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.history-title{font-size:14px;font-weight:700}
.history-link{font-size:12px;color:var(--blue);font-weight:500}
.hist-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.hist-item:last-child{border-bottom:none}
.hist-left{min-width:0}
.hist-cat{font-size:13px;font-weight:600}
.hist-sub{font-size:11px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-amount{font-size:14px;font-weight:700;white-space:nowrap}
.day-head{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--muted);padding:12px 0 2px}
.day-head:first-child{padding-top:0}
.empty-text{font-size:12px;color:var(--sub);text-align:center;padding:14px 0}
.type-switch{display:flex;background:var(--input);border-radius:10px;padding:3px;gap:4px}
.type-btn{flex:1;text-align:center;padding:8px 0;font-size:13px;font-weight:600;border-radius:8px;color:var(--muted)}
.type-btn.active{background:var(--btn);color:var(--text)}
.input-box{background:var(--input);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;color:var(--text);font-size:16px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
.input-box:focus{border-color:var(--blue)}
textarea.input-box{resize:vertical;min-height:84px}
select.input-box{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.form-group{display:flex;flex-direction:column;gap:6px}
.btn-save{background:var(--blue);color:#fff;border-radius:14px;padding:14px;font-size:15px;font-weight:700;text-align:center;display:block;width:100%;margin-top:4px}
.btn-save.green{background:var(--green);color:#06210f}
.btn-ghost{background:var(--btn);color:var(--text);border-radius:12px;padding:11px 14px;font-size:13px;font-weight:600;text-align:center}
.btn-danger{background:rgba(255,107,107,.14);color:var(--red);border-radius:12px;padding:11px 14px;font-size:13px;font-weight:600;text-align:center}
.btn-row{display:flex;gap:8px}.btn-row>*{flex:1}
.cat-group{font-size:10px;font-weight:700;color:var(--sub);letter-spacing:.4px;text-transform:uppercase;margin:8px 0 4px}
.cat-group:first-child{margin-top:0}
.cat-pills{display:flex;flex-wrap:wrap;gap:6px}
.cat-pill{background:var(--btn);border-radius:20px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--muted)}
.cat-pill.selected{background:var(--blue);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{background:var(--btn);border-radius:20px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;flex:none}
.chip.on{background:var(--blue)}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.summary-box{background:var(--input);border-radius:12px;padding:10px 12px}
.summary-title{font-size:11px;color:var(--muted);font-weight:500}
.summary-val{font-size:16px;font-weight:700;margin-top:4px}
.budget-item{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.budget-item:last-child{border-bottom:none}
.budget-head{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.bar{width:100%;height:6px;background:var(--progress);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:3px}
.bar.green>i{background:var(--green)}
.budget-sub{display:flex;justify-content:space-between;font-size:11px;color:var(--sub)}
.month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:6px}
.month-nav button{width:40px;height:36px;border-radius:10px;font-size:18px;color:var(--blue)}
.month-nav button:disabled{color:var(--sub);opacity:.4}
.month-nav span{font-size:14px;font-weight:700}
.menu-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:14px}
.menu-item .mi-ic{font-size:20px;width:28px;text-align:center}
.menu-item .mi-t{font-size:14px;font-weight:600}.menu-item .mi-s{font-size:11px;color:var(--sub);margin-top:2px}
.menu-item .mi-go{margin-left:auto;color:var(--sub)}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(11,14,20,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--sab);z-index:20}
.tabbar-in{width:100%;max-width:520px;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;padding:6px 8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:10px;font-weight:600;color:var(--sub)}
.tab .ic{font-size:19px;filter:grayscale(1) brightness(1.1);opacity:.75}
.tab.on{color:var(--blue)}.tab.on .ic{filter:none;opacity:1}
.fab{width:50px;height:50px;border-radius:50%;background:var(--blue);color:#fff;font-size:28px;font-weight:300;display:flex;align-items:center;justify-content:center;margin:-16px auto 0;box-shadow:0 6px 18px rgba(91,141,239,.45)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + var(--sab));max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;animation:up .2s}
.sheet h3{font-size:17px;font-weight:700}
.sheet .msg{font-size:13px;color:var(--muted);line-height:1.45;white-space:pre-line}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right;font-weight:600}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + var(--sab));background:#26324a;color:#fff;border-radius:14px;padding:11px 16px;font-size:13px;font-weight:600;z-index:60;display:flex;gap:14px;align-items:center;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast button{color:var(--blue);font-weight:700}
.banner{background:rgba(91,141,239,.12);border:1px solid rgba(91,141,239,.35);border-radius:14px;padding:12px 14px;font-size:12px;line-height:1.45;color:#cdd9f5}
.banner.warn{background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.35);color:#ffd0d0}
.banner b{color:#fff}
.banner .btn-ghost{margin-top:8px;display:inline-block}
.pos{color:var(--green)}.neg{color:var(--red)}.muted{color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{font-size:10px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--btn);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.warn{background:rgba(255,107,107,.15);color:var(--red)}.tag.ok{background:rgba(72,213,151,.14);color:var(--green)}
svg.chart rect{fill:var(--blue)}svg.chart rect.today{fill:var(--green)}svg.chart rect.zero{fill:var(--progress)}
svg.chart text{fill:var(--sub);font-size:9px}
.hint{font-size:11px;color:var(--sub);line-height:1.4}
.check{display:flex;gap:10px;align-items:center;font-size:13px}.check input{width:20px;height:20px;accent-color:var(--blue)}
@media(min-width:700px){#app{padding-top:28px}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar"><div class="tabbar-in" id="tabbar"></div></nav>
<div id="overlay"></div>
<div id="toast-host"></div>
<input type="file" id="file-json" accept=".json,application/json" hidden>
<input type="file" id="file-img" accept="image/*" hidden>

<script>
"use strict";
/* ============ КОНСТАНТЫ (перенесены из Scriptable без изменений) ============ */
const CURRENCY = "₽";
const INCOME_CATEGORIES = [
  "Зарплата", "Подработка", "Премия", "Возврат долга",
  "Возврат", "Проценты и кэшбэк", "Прочее"
];

const EXPENSE_GROUPS = {
  "Обязательные (жильё/кредиты)": [
    "Ипотека / Кредит", "ЖКХ и квартплата", "Связь и интернет",
    "Подписки и сервисы", "Страхование и налоги"
  ],
  "Повседневные расходы": [
    "Продукты", "Кафе и доставка", "Транспорт и бензин",
    "Аптека и здоровье", "Быт и дом"
  ],
  "Образ жизни и разовые": [
    "Покупки и техника", "Спорт и форма", "Развлечения и отдых",
    "Путешествия", "Подарки", "Дано в долг", "Прочее"
  ]
};

const SMART_RULES = [
  { type:"income", category:"Зарплата", keywords:["зарплат","аванс","расчетный","оплата труда","получка","зачисление зарплат"] },
  { type:"income", category:"Премия", keywords:["преми","бонус"] },
  { type:"income", category:"Проценты и кэшбэк", keywords:["кэшбэк","cashback","процент на остаток","выплата процентов"] },
  { type:"income", category:"Возврат долга", keywords:["вернул","отдал долг","возврат долг"] },
  { type:"income", category:"Подработка", keywords:["перевод от","пополнение","зачисление","перевод по сбп"] },
  { type:"expense", section:"Обязательные (жильё/кредиты)", category:"Ипотека / Кредит", keywords:["ипотек","кредит","взнос по","гашение долга","платеж по кредиту","займ"] },
  { type:"expense", section:"Обязательные (жильё/кредиты)", category:"ЖКХ и квартплата", keywords:["жкх","квартплат","энергосбыт","водоканал","капремонт","домофон","тсж","еирц","мусор"] },
  { type:"expense", section:"Обязательные (жильё/кредиты)", category:"Связь и интернет", keywords:["мтс","билайн","мегафон","tele2","t2","ростелеком","дом.ру","провайдер","интернет"] },
  { type:"expense", section:"Обязательные (жильё/кредиты)", category:"Подписки и сервисы", keywords:["yandex plus","яндекс плюс","apple.com/bill","tinkoff pro","кинопоиск","иви"] },
  { type:"expense", section:"Повседневные расходы", category:"Продукты", keywords:["магнит","пятерочк","перекресток","вкусвилл","лента","ашан","spar","продукты","молоко","мясо","пятёрочк"] },
  { type:"expense", section:"Повседневные расходы", category:"Кафе и доставка", keywords:["додо","вкусно и точка","kfc","ростикс","бургер кинг","кофе","кафе","ресторан","самокат","яндекс лавка","яндекс еда","обед","ужин","завтрак"] },
  { type:"expense", section:"Повседневные расходы", category:"Транспорт и бензин", keywords:["азс","лукойл","газпромнефть","роснефть","татнефть","бензин","такси","яндекс го","uber","парковка","проезд"] },
  { type:"expense", section:"Повседневные расходы", category:"Аптека и здоровье", keywords:["аптека","фарм","ригла","вита","планета здоровья","клиника","анализ","стоматолог"] },
  { type:"expense", section:"Повседневные расходы", category:"Быт и дом", keywords:["хозтовар","бытовая химия","дом и сад","уборка"] },
  { type:"expense", section:"Образ жизни и разовые", category:"Дано в долг", keywords:["в долг","одолжил","занял "] },
  { type:"expense", section:"Образ жизни и разовые", category:"Покупки и техника", keywords:["ozon","wildberries","вайлдберриз","aliexpress","dns","м.видео","ситилинк","леруа","лемана"] },
  { type:"expense", section:"Образ жизни и разовые", category:"Спорт и форма", keywords:["фитнес","спортзал","спортмастер","бассейн","тренажер","спортпит"] },
  { type:"expense", section:"Образ жизни и разовые", category:"Развлечения и отдых", keywords:["кино","театр","парк","баня","сауна","steam"] },
  { type:"expense", section:"Образ жизни и разовые", category:"Путешествия", keywords:["отель","гостиница","авиабилет","ржд","поезд","самолет","самолёт"] }
];

function resolveSection(category) {
  for (const [section, categories] of Object.entries(EXPENSE_GROUPS)) {
    if (categories.includes(category)) return section;
  }
  return "Повседневные расходы";
}

function parseAmountCandidates(text) {
  const candidates = [];
  const lines = String(text || "").replace(/\r/g, "").split("\n");
  let offset = 0;
  for (const line of lines) {
    const lower = line.toLowerCase();
    if (/\b(?:инн|ккт|фн|фд|фпд|фискальн\w*|регистрационн\w* номер|заводск\w* номер|номер смены|порядков\w* номер|qr-код)\b/i.test(lower)) {
      offset += line.length + 1; continue;
    }
    const re = /(?<![\d\w])(?:\d{1,3}(?:[ \u00A0]\d{3})+|\d{1,7})(?:[.,]\d{1,2})?(?!\d)/g;
    let m;
    while ((m = re.exec(line)) !== null) {
      const raw = m[0].trim();
      const compact = raw.replace(/[ \u00A0]/g, "").replace(",", ".");
      const amount = Number(compact);
      if (!Number.isFinite(amount) || amount <= 0 || amount > 1000000) continue;
      if (/^\d{1,2}[./-]\d{1,2}(?:[./-]\d{2,4})?$/.test(raw)) continue;
      const after = line.slice(m.index + m[0].length).toLowerCase();
      const before = line.slice(0, m.index).toLowerCase();
      if (/^\s*(?:%|проц)/i.test(after)) continue;
      if (/\b(?:номер|№|код|телефон|смена|позиция|шт\.?|кол-во|количество)\s*[:#№-]?\s*$/i.test(before)) continue;
      candidates.push({ amount, raw, index: offset + m.index, line, currency: /(?:₽|руб(?:\.|лей|ля)?|\bр\.)/i.test(line) });
    }
    offset += line.length + 1;
  }
  return candidates;
}

function chooseReceiptAmount(text, candidates) {
  const lines = String(text || "").replace(/\r/g, "").split("\n");
  
  // 1. Приоритетный поиск строки «ИТОГ» / «ИТОГО» / «К ОПЛАТЕ» / «СУММА»
  const totalLabel = /(?:^|[\s=;:*])(?:итог(?:о)?|всего|к\s*оплате|сумма\s*(?:расч[её]та|покупки|к\s*оплате)|оплачено|total\s*due|grand\s*total|total)(?:[\s=:*]|$)/i;
  const excludedLine = /предыдущий итог|промежуточный итог|скидка|сдача|налог|ндс|кэшбэк|cashback|в\s*т\.ч\./i;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!totalLabel.test(line) || excludedLine.test(line)) continue;

    // Ищем сумму в самой строке «ИТОГ» или на следующей строке (если OCR перенес сумму)
    const checkText = line + " " + (lines[i + 1] || "");
    const tokens = checkText.match(/=?[ \t]*(\d{1,6}(?:[.,]\d{1,2}))(?!\d)/g) || [];
    
    const values = tokens.map(t => {
      const clean = t.replace(/[= \t]/g, "").replace(",", ".");
      return Number(clean);
    }).filter(v => Number.isFinite(v) && v > 0 && v <= 1000000);

    if (values.length > 0) {
      return values[0]; // Берем прямое значение суммы итога
    }
  }

  // 2. Если прямой строки «ИТОГ» нет — фильтруем кандидатов
  if (!candidates || !candidates.length) return 0;
  
  const safe = candidates.filter(c => {
    const line = String(c.line || "").toLowerCase();
    if (c.amount <= 0 || c.amount > 1000000) return false;
    // Исключаем реквизиты, даты, время, проценты и служебные строки
    if (/инн|ккт|\bфн\b|\bфд\b|\bфпд\b|фискальн|регистрационн|смена|номер|тел|кассир|место расчетов/i.test(line)) return false;
    if (/%|процент|предоплата|скидка|сдача|ндс|налог|нал|безнал/i.test(line)) return false;
    return true;
  });

  if (!safe.length) return 0;

  // Отдаем предпочтение суммам с копейками (.XX или ,XX)
  const decimal = safe.filter(c => /[.,]\d{2}\b/.test(String(c.raw || "")));
  const pool = decimal.length ? decimal : safe;

  return pool.reduce((best, item) => item.amount > best.amount ? item : best).amount;
}


function parseBankSMS(text) {
  const lower = text.toLowerCase();
  const isBank = /покупка|списание|оплата|зачисление|перевод|карта|счет|баланс|authcode|kod/i.test(lower);
  if (!isBank) return null;
  let type = "expense";
  if (/зачисление|пополнение|перевод от|возврат покупки|зарплата/i.test(lower)) type = "income";
  let cleaned = text.replace(/баланс[\s:]*[\d\s.,]+[₽рRUB]*/gi, "")
                    .replace(/остаток[\s:]*[\d\s.,]+[₽рRUB]*/gi, "")
                    .replace(/лимит[\s:]*[\d\s.,]+[₽рRUB]*/gi, "");
  const sumMatch = cleaned.match(/(?:покупка|списание|оплата|сумма|на)?\s*([0-9]{1,3}(?:[ \u00A0][0-9]{3})*(?:[.,][0-9]{1,2})?|[0-9]+(?:[.,][0-9]{1,2})?)\s*(?:₽|руб|р(?![а-яёa-z]))/i)
                || cleaned.match(/([0-9]+(?:[.,][0-9]{1,2})?)\s*(?:₽|руб|р(?![а-яёa-z]))/i);
  if (!sumMatch) return null;
  const amount = Number(sumMatch[1].replace(/[ \u00A0]/g, "").replace(",", "."));
  if (!Number.isFinite(amount) || amount <= 0) return null;
  let note = "Банковская операция";
  const placeMatch = text.match(/(?:в|у|to)\s+([A-Za-zА-Яа-я0-9\s._-]{3,25})(?:\.\s|;|\sБаланс|\sОстаток|$)/i);
  if (placeMatch) note = placeMatch[1].trim();
  return { amount, type, note };
}

function parseSmartText(raw) {
  if (!raw || !String(raw).trim()) return null;
  const text = String(raw).trim(), lower = text.toLowerCase().replace(/ё/g, "е");
  const bankResult = parseBankSMS(text);
  let amount = bankResult ? bankResult.amount : null;
  let type = bankResult ? bankResult.type : "expense";
  let note = bankResult ? bankResult.note : "";

  if (!amount) {
    try {
      const candidates = parseAmountCandidates(text);
      const receiptAmount = chooseReceiptAmount(text, candidates);
      if (receiptAmount && Number.isFinite(Number(receiptAmount))) {
        amount = Number(receiptAmount);
        const lines = text.split(/\n+/).map(s=>s.trim()).filter(Boolean);
        if (lines.length > 1) {
          const merchant = lines.find(s=>s.length >= 3 && !/^\d+[.,]?\d*\s*(₽|руб)?$/i.test(s) && !/кассовый чек|приходный чек|ИНН|ККТ|ФН|ФД|ФПД|смена|чек №/i.test(s));
          if (merchant) note = "Чек: " + merchant.slice(0, 50);
        }
      }
    } catch (_) {}
  }

  if (!amount) {
    const normalized = text.replace(/\u00A0/g, " ");
    const amountPattern = /(?:^|[^\d])(\d{1,3}(?:[ \u00A0]\d{3})+|\d{1,7})(?:([.,])(\d{1,2}))?(?!\d)/g;
    const amounts = [];
    let match;
    while ((match = amountPattern.exec(normalized)) !== null) {
      const rawNumber = match[1].replace(/[ \u00A0]/g, "") + (match[2] && match[3] ? "." + match[3] : "");
      const value = Number(rawNumber);
      if (Number.isFinite(value) && value > 0 && value <= 10000000) amounts.push({ value, index: match.index, length: match[0].length });
    }
    if (amounts.length > 0) {
      const a = amounts[amounts.length - 1];
      amount = a.value;
      note = (text.slice(0, a.index) + " " + text.slice(a.index + a.length)).replace(/[,\s]+/g, " ").trim();
    }
  }

  if (!amount) return null;
  note = note.replace(/\b(?:руб(?:лей|ля|\.?)?|₽|р\.?)\b/gi, "").trim();
  if (!note) note = "Операция";

  let section = "Повседневные расходы";
  let category = "Прочее";
  for (const rule of SMART_RULES) {
    if (rule.keywords.some(k => lower.includes(k.toLowerCase()))) {
      type = rule.type; category = rule.category; section = rule.section || (type === "expense" ? resolveSection(category) : null); break;
    }
  }
  return { amount, type, section, category, note, raw: text };
}

function makeId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

/* Нормализация — та же логика, что в loadData() скрипта; нужна и для импорта бэкапа */
function normalize(parsed) {
  const def = defaultData();
  const base = { ...def, ...parsed };
  if (!base.sectionBudgets || typeof base.sectionBudgets !== "object") base.sectionBudgets = def.sectionBudgets;
  for (const s of Object.keys(def.sectionBudgets)) if (!(s in base.sectionBudgets)) base.sectionBudgets[s] = def.sectionBudgets[s];
  if (!Array.isArray(base.recurring)) base.recurring = def.recurring;
  if (!Array.isArray(base.templates)) base.templates = def.templates;
  for (const k of ["transactions","goals","loans"]) if (!Array.isArray(base[k])) base[k] = [];
  base.transactions = base.transactions.map(t => {
    const type = t.type === "income" ? "income" : "expense";
    let category = t.category || "Прочее";
    if (category === "Жильё и ЖКХ") category = "ЖКХ и квартплата";
    if (category === "Кафе и рестораны") category = "Кафе и доставка";
    if (category === "Транспорт") category = "Транспорт и бензин";
    if (category === "Дом") category = "Быт и дом";
    return {
      id: t.id || makeId(), type,
      amount: Math.max(0, Number(t.amount) || 0),
      section: type === "expense" ? (t.section || resolveSection(category)) : null,
      category, note: t.note || "",
      date: t.date || new Date().toISOString(),
      ...(t.recurringId ? { recurringId: t.recurringId } : {})
    };
  });
  base.goals = base.goals.map(g => ({ id: g.id || makeId(), name: String(g.name || "Цель"), target: Number(g.target) || 0, saved: Number(g.saved) || 0 }));
  base.loans = base.loans.map(l => ({
    id: l.id || makeId(), name: String(l.name || "Должник"),
    originalAmount: Number(l.originalAmount) || 0, remainingAmount: Number(l.remainingAmount) || 0,
    isOld: !!l.isOld, transactionId: l.transactionId || null, date: l.date || new Date().toISOString()
  }));
  base.recurring = base.recurring.map(r => ({
    id: r.id || makeId(), name: String(r.name || "Платёж"), day: Math.min(31, Math.max(1, Math.round(Number(r.day) || 1))),
    amount: Number(r.amount) || 0, category: r.category || "Ипотека / Кредит",
    section: r.section || resolveSection(r.category || "Ипотека / Кредит")
  }));
  base.initialBalance = Number(base.initialBalance) || 0;
  base.version = 7;
  return base;
}

let data;
function loadData() {
  let raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch (_) { memoryOnly = true; }
  if (!raw) return defaultData();
  try { return normalize(JSON.parse(raw)); }
  catch (e) {
    try { localStorage.setItem(LS_KEY + ".corrupt", raw); } catch (_) {}
    setTimeout(() => toast("База повреждена — копия сохранена, запущена пустая"), 300);
    return defaultData();
  }
}
function saveData() {
  data.version = 7;
  if (memoryOnly) return;
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); }
  catch (e) { memoryOnly = true; toast("Не удаётся сохранить данные в браузере!"); }
}

/* ============ РАСЧЁТЫ ============ */
function fmt(value, decimals = 0) {
  return (Number(value) || 0).toLocaleString("ru-RU", { minimumFractionDigits: 0, maximumFractionDigits: decimals });
}
function money(v) { return fmt(v, 0) + " " + CURRENCY; }
function dateKey(value) {
  const d = new Date(value);
  return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, "0"), String(d.getDate()).padStart(2, "0")].join("-");
}
function monthKey(value) { const d = new Date(value); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
function monthLabel(key) { const [y, m] = key.split("-").map(Number); const s = new Date(y, m - 1, 1, 12).toLocaleDateString("ru-RU", { month: "long", year: "numeric" }); return s.charAt(0).toUpperCase() + s.slice(1); }
function displayDate(v) { return new Date(v).toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit", year: "numeric" }); }
function longDate(v) {
  const d = new Date(v), t = dateKey(new Date()), y = dateKey(new Date(Date.now() - 864e5));
  const k = dateKey(d);
  if (k === t) return "Сегодня";
  if (k === y) return "Вчера";
  return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", weekday: "short" });
}
function shiftMonth(key, delta) { const [y, m] = key.split("-").map(Number); return monthKey(new Date(y, m - 1 + delta, 1, 12)); }

function monthTransactions(key = monthKey(new Date())) { return data.transactions.filter(t => monthKey(t.date) === key); }
function todayTransactions() { const k = dateKey(new Date()); return data.transactions.filter(t => dateKey(t.date) === k); }
function totalIncome(ts) { return ts.filter(t => t.type === "income").reduce((s, t) => s + t.amount, 0); }
function totalExpenses(ts) { return ts.filter(t => t.type === "expense").reduce((s, t) => s + t.amount, 0); }
function balance() { return data.initialBalance + totalIncome(data.transactions) - totalExpenses(data.transactions); }
function savedTotal() { return data.goals.reduce((s, g) => s + (Number(g.saved) || 0), 0); }
function totalOwedToMe() { return data.loans.reduce((s, l) => s + (Number(l.remainingAmount) || 0), 0); }
function daysRemainingInMonth() { const n = new Date(), last = new Date(n.getFullYear(), n.getMonth() + 1, 0); return Math.max(1, last.getDate() - n.getDate() + 1); }

function isRecurringPaid(r, ts = monthTransactions()) {
  return ts.some(t => t.type === "expense" && (t.recurringId === r.id || (t.category === r.category && Math.abs(t.amount - r.amount) < 150)));
}
function pendingRecurringTotal() {
  const day = new Date().getDate(), ts = monthTransactions();
  return data.recurring.reduce((sum, r) => sum + (!isRecurringPaid(r, ts) && r.day >= day ? r.amount : 0), 0);
}
function dailySpent(ts) { return ts.filter(t => t.type === "expense" && t.section === "Повседневные расходы").reduce((s, t) => s + t.amount, 0); }
/* Лимит на сегодня: (бюджет − траты ДО сегодняшнего дня) / оставшиеся дни, включая сегодня.
   В версии для Scriptable траты за сегодня вычитались дважды — здесь это исправлено. */
function todayLimit() {
  const budget = data.sectionBudgets["Повседневные расходы"] || 0;
  const tk = dateKey(new Date());
  const before = dailySpent(monthTransactions().filter(t => dateKey(t.date) !== tk));
  return Math.max(0, (budget - before) / daysRemainingInMonth());
}
function todaySpentDaily() { return dailySpent(todayTransactions()); }
function totalMonthlyBudget() { return Object.values(data.sectionBudgets).reduce((s, v) => s + v, 0); }
function progress(v, t) { return t <= 0 ? 0 : Math.min(1, Math.max(0, v / t)); }

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function parseNum(s) {

}

/* Универсальная форма в шторке. fields: [{key,label,type,value,placeholder,options}] */
function formSheet({ title, message = "", fields, okLabel = "Сохранить", extra = "" }) {
  return new Promise(res => {
    const f = fields.map(x => {
      const id = "f_" + x.key;
      if (x.type === "select") return `<div class="form-group"><label class="card-label" for="${id}">${esc(x.label)}</label><select id="${id}" class="input-box">${x.options.map(o => `<option value="${esc(o)}"${o === x.value ? " selected" : ""}>${esc(o)}</option>`).join("")}</select></div>`;
      if (x.type === "check") return `<label class="check"><input type="checkbox" id="${id}"${x.value ? " checked" : ""}>${esc(x.label)}</label>`;
      const mode = x.type === "money" ? `type="text" inputmode="decimal"` : x.type === "int" ? `type="text" inputmode="numeric"` : `type="text"`;
      return `<div class="form-group"><label class="card-label" for="${id}">${esc(x.label)}</label><input id="${id}" class="input-box" ${mode} value="${esc(x.value ?? "")}" placeholder="${esc(x.placeholder || "")}"></div>`;
    }).join("");
    const bg = openSheet(`<h3>${esc(title)}</h3>${message ? `<div class="msg">${esc(message)}</div>` : ""}${f}${extra}
      <div class="btn-row"><button class="btn-ghost" data-r="0">Отмена</button><button class="btn-save" style="margin:0" data-r="1">${esc(okLabel)}</button></div>`);
    const submit = () => {
      const out = {};
      for (const x of fields) {
        const el = $("#f_" + x.key, bg);
        if (x.type === "check") out[x.key] = el.checked;
        else if (x.type === "money" || x.type === "int") {
          const raw = el.value.trim();
          if (raw === "" && x.optional) { out[x.key] = null; continue; }
          const n = parseNum(raw);
          if (!Number.isFinite(n) || n < 0) { el.style.borderColor = "var(--red)"; el.focus(); return; }
          out[x.key] = x.type === "int" ? Math.round(n) : n;
        } else {
          const v = el.value.trim();
          if (x.required && !v) { el.style.borderColor = "var(--red)"; el.focus(); return; }
          out[x.key] = v;
        }
      }
      closeSheet(); res(out);
    };
    $$("[data-r]", bg).forEach(b => b.onclick = () => b.dataset.r === "1" ? submit() : (closeSheet(), res(null)));
    $$("[data-x]", bg).forEach(b => b.onclick = () => { closeSheet(); res({ __x: b.dataset.x }); });
    bg.addEventListener("click", e => { if (e.target === bg) res(null); });
    $$("input.input-box", bg).forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") submit(); }));
    const first = $("input.input-box,select", bg); if (first && !matchMedia("(pointer:coarse)").matches) first.focus();
  });
}

function download(filename, text, mime) {
  const blob = new Blob([text], { type: mime });
  const file = new File([blob], filename, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /iPhone|iPad|Android/i.test(navigator.userAgent)) {
    navigator.share({ files: [file], title: filename }).catch(() => {});
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function viewAnalytics() {
  const key = ui.anMonth, cur = monthKey(new Date());
  const ts = monthTransactions(key);
  const inc = totalIncome(ts), exp = totalExpenses(ts), net = inc - exp;
  const groupSpent = {}, catSpent = {}, incCat = {}, daily = {};
  for (const t of ts) {
    if (t.type === "income") { incCat[t.category] = (incCat[t.category] || 0) + t.amount; continue; }
    const s = t.section || "Повседневные расходы";
    groupSpent[s] = (groupSpent[s] || 0) + t.amount;
    catSpent[t.category] = (catSpent[t.category] || 0) + t.amount;
    const d = new Date(t.date).getDate(); daily[d] = (daily[d] || 0) + t.amount;
  }
  const sections = Object.keys(data.sectionBudgets).map(s => {
    const fact = groupSpent[s] || 0, plan = data.sectionBudgets[s] || 0;
    const pct = plan > 0 ? Math.min(100, Math.round(fact / plan * 100)) : 0, over = fact > plan;
    return `<div class="budget-item"><div class="budget-head"><span>${esc(s)}</span><span style="color:${over ? "var(--red)" : "var(--text)"};white-space:nowrap">${money(fact)} / ${money(plan)}</span></div>
      <div class="bar"><i style="width:${pct}%;background:${over ? "var(--red)" : "var(--blue)"}"></i></div>
      <div class="budget-sub"><span>${pct}% использовано</span><span>${over ? "Перерасход: " : "Остаток: "}${money(Math.abs(plan - fact))}</span></div></div>`;
  }).join("");
  const cats = Object.entries(catSpent).sort((a, b) => b[1] - a[1]);
  const max = cats.length ? cats[0][1] : 1;
  const topCats = cats.length ? cats.map(([n, v], i) => `<div class="budget-item" style="gap:5px"><div class="budget-head"><span>${i + 1}. ${esc(n)}</span><span>${money(v)}</span></div><div class="bar"><i style="width:${Math.round(v / max * 100)}%"></i></div></div>`).join("")
    : `<div class="empty-text">Нет расходов в этом месяце</div>`;
  const incs = Object.entries(incCat).sort((a, b) => b[1] - a[1]);

  const [y, m] = key.split("-").map(Number), dim = new Date(y, m, 0).getDate();
  const maxD = Math.max(1, ...Object.values(daily)), todayD = key === cur ? new Date().getDate() : -1;
  const W = 300, H = 70, bw = W / dim;
  const bars = Array.from({ length: dim }, (_, i) => {
    const d = i + 1, v = daily[d] || 0, h = v ? Math.max(2, v / maxD * H) : 1.5;
    return `<rect class="${d === todayD ? "today" : v ? "" : "zero"}" x="${(i * bw + 1).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="1.5"><title>${d}: ${money(v)}</title></rect>`;
  }).join("");
  const avg = exp / (key === cur ? new Date().getDate() : dim);

  return `${header(monthLabel(key), "ОТЧЁТ")}
  <div class="month-nav"><button data-act="mprev">‹</button><span>${monthLabel(key)}</span><button data-act="mnext" ${key >= cur ? "disabled" : ""}>›</button></div>
  <div class="card">
    <div class="summary-grid">
      <div class="summary-box"><div class="summary-title">Доходы</div><div class="summary-val pos">+${money(inc)}</div></div>
      <div class="summary-box"><div class="summary-title">Расходы</div><div class="summary-val neg">−${money(exp)}</div></div>
    </div>
    <div class="card-sublink ${net >= 0 ? "pos" : "neg"}" style="margin-top:4px">Сальдо месяца: ${net >= 0 ? "+" : "−"}${money(Math.abs(net))}</div>
  </div>
  <div class="history-card"><div class="history-title" style="margin-bottom:8px">Лимиты по разделам (План / Факт)</div>${sections}</div>
  <div class="history-card"><div class="history-header"><div class="history-title">Расходы по дням</div><div class="hint">в среднем ${money(avg)}/день</div></div>
    <svg class="chart" viewBox="0 0 ${W} ${H + 12}" width="100%" role="img" aria-label="Расходы по дням">${bars}
      <text x="0" y="${H + 10}">1</text><text x="${W / 2 - 4}" y="${H + 10}">${Math.round(dim / 2)}</text><text x="${W - 10}" y="${H + 10}">${dim}</text></svg></div>
  <div class="history-card"><div class="history-title" style="margin-bottom:8px">Топ расходов по категориям</div>${topCats}</div>
  ${incs.length ? `<div class="history-card"><div class="history-title" style="margin-bottom:8px">Доходы по категориям</div>${incs.map(([n, v]) => `<div class="hist-item" style="cursor:default"><div class="hist-cat">${esc(n)}</div><div class="hist-amount pos">+${money(v)}</div></div>`).join("")}</div>` : ""}`;
}

function dateToIso(dstr, keepTimeFrom) {
  const now = new Date();

}

async function submitForm() {
  readForm();
  const amt = parseNum(form.amount);
  if (!amt || amt <= 0) { toast("Введите корректную сумму"); $("#in-amount").focus(); return; }
  const category = form.category || "Прочее";
  const note = form.note.trim();
  if (form.editId) {
    const t = data.transactions.find(x => x.id === form.editId);
    if (t) {
      const dayChanged = dateKey(t.date) !== form.date;
      Object.assign(t, { type: form.type, amount: amt, category, note, section: form.type === "expense" ? resolveSection(category) : null });
      if (dayChanged) t.date = dateToIso(form.date, t.date);
      saveData();
    }
    form = null; toast("Изменения сохранены"); location.hash = "#/history"; return;
  }
  addTx({ type: form.type, amount: amt, category, note, date: dateToIso(form.date) });
  const label = `${form.type === "income" ? "+" : "−"}${money(amt)} · ${category}`;
  form = null; location.hash = "#/"; toast("Записано: " + label);
}

async function splitFlow() {
  readForm();
  const total = parseNum(form.amount);
  if (!total || total <= 0) { toast("Сначала введите сумму счёта"); return; }
  const category = form.category || "Прочее", section = resolveSection(category);
  const r = await formSheet({
    title: "Разделить счёт", message: `Общий счёт: ${money(total)}. Укажите, на сколько человек делим (включая вас).`,
    fields: [{ key: "n", label: "Людей", type: "int", value: 2 }, { key: "debt", label: "Создать должников на остальную часть", type: "check", value: true }],
    okLabel: "Далее"
  });
  if (!r) return;
  const persons = Math.max(2, r.n);
  const myShare = Math.round(total / persons * 100) / 100, others = total - myShare, per = Math.round(others / (persons - 1) * 100) / 100;
  const names = [];
  if (r.debt) {
    const fields = Array.from({ length: persons - 1 }, (_, i) => ({ key: "n" + i, label: `Должник #${i + 1} (по ${money(per)})`, type: "text", value: `Друг ${i + 1}` }));
    const nr = await formSheet({ title: "Кто должен?", message: `Ваша часть: ${money(myShare)}. Вам должны: ${money(others)}.`, fields, okLabel: "Записать" });
    if (!nr) return;
    fields.forEach(f => names.push(nr[f.key] || f.value));
  } else if (!await confirmDlg("Записать мою долю?", `Ваша часть: ${money(myShare)} из ${money(total)}`, "Записать", false)) return;
  const date = dateToIso(form.date);
  addTx({ type: "expense", amount: myShare, section, category, note: `Сплит (1/${persons} от ${money(total)})` + (form.note ? ` · ${form.note}` : ""), date });
  names.forEach(name => data.loans.push({ id: makeId(), name, originalAmount: per, remainingAmount: per, isOld: false, transactionId: null, date: new Date().toISOString() }));
  saveData(); form = null; location.hash = "#/"; toast(`Сплит сохранён: ${money(myShare)}`);
}

function startVoice() {

  const r = new SR(); r.lang = "ru-RU"; r.interimResults = false; r.maxAlternatives = 1;
  if (st) st.textContent = "🎙 Слушаю… назовите, например: «кофе 200»";

  r.onerror = e => { if (st) st.innerHTML = `<span class="neg">Не удалось распознать речь (${esc(e.error)}). Разрешите доступ к микрофону или введите текст.</span>`; };
  r.onend = () => { if (st && st.textContent.startsWith("🎙")) st.textContent = ""; };
  try { r.start(); } catch (_) {}
}

let ocrScriptPromise;
function loadOcr() {
  if (window.Tesseract) return Promise.resolve();
  return ocrScriptPromise || (ocrScriptPromise = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
    s.onload = res; s.onerror = () => { ocrScriptPromise = null; rej(new Error("нет сети или CDN недоступен")); };
    document.head.appendChild(s);
  }));
}
async function downscale(file, maxSide = 1800) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const ctx = c.getContext("2d"); ctx.filter = "grayscale(1) contrast(1.25)"; ctx.drawImage(bmp, 0, 0, c.width, c.height);
  return c;
}
async function ocrFile(file) {
  const st = $("#smart-status");
  try {
    if (st) st.textContent = "Загружаю модуль распознавания (первый раз ~10 МБ)…";
    await loadOcr();
    const img = await downscale(file);
    const worker = await Tesseract.createWorker("rus+eng", 1, {
      logger: m => { if (m.status === "recognizing text" && st) st.textContent = `Распознаю чек… ${Math.round(m.progress * 100)}%`; }
    });
    const { data: { text } } = await worker.recognize(img);
    await worker.terminate();
    if (!text.trim()) { if (st) st.innerHTML = `<span class="neg">Текст на фото не найден</span>`; return; }
    $("#smart").value = text; runParse(text);
  } catch (e) {
    if (st) st.innerHTML = `<span class="neg">Не получилось распознать фото: ${esc(e.message || e)}. Можно вставить текст чека вручную.</span>`;
  }
}

  }).join("");
  return `${header("Обязательства", "", "#/more")}
  <div class="card" style="cursor:default"><div class="card-label">Осталось списать в этом месяце</div><div class="balance-val" style="font-size:24px">${money(pendingRecurringTotal())}</div>
    <div class="hint">Считаются неоплаченные платежи, срок которых ещё не прошёл. Платёж считается оплаченным, если нажать «Оплатить» или есть расход в той же категории с суммой ±150 ₽.</div></div>
  <div class="history-card">${list || `<div class="empty-text">Платежей нет</div>`}</div>
  <button class="btn-save" data-act="radd">＋ Добавить обязательный платёж</button>`;
}
async function recurringForm(r) {
  const cats = Object.values(EXPENSE_GROUPS).flat();
  const res = await formSheet({
    title: r ? "Изменить платёж" : "Новый платёж",
    fields: [
      { key: "name", label: "Название", type: "text", value: r?.name || "", required: true },
      { key: "day", label: "День месяца (1–31)", type: "int", value: r?.day || 1 },
      { key: "amount", label: "Сумма", type: "money", value: r?.amount ?? "" },
      { key: "category", label: "Категория", type: "select", options: cats, value: r?.category || "Ипотека / Кредит" }
    ]
  });
  if (!res) return;
  const rec = { name: res.name, day: Math.min(31, Math.max(1, res.day)), amount: res.amount, category: res.category, section: resolveSection(res.category) };
  if (r) Object.assign(r, rec); else data.recurring.push({ id: makeId(), ...rec });
  saveData(); render();
}

/* ---- цели ---- */
function viewGoals() {
  const list = data.goals.map(g => {
    const p = Math.round(progress(g.saved, g.target) * 100);
    return `<div class="budget-item"><div class="budget-head"><span>${esc(g.name)}</span><span>${p}%</span></div>
      <div class="bar green"><i style="width:${p}%"></i></div>
      <div class="budget-sub"><span>${money(g.saved)} из ${money(g.target)}</span><span>осталось ${money(Math.max(0, g.target - g.saved))}</span></div>
      <div class="btn-row" style="margin-top:4px"><button class="btn-ghost" data-act="gadd" data-id="${esc(g.id)}">＋ Пополнить</button><button class="btn-ghost" data-act="gedit" data-id="${esc(g.id)}">✏️ Изменить</button></div></div>`;
  }).join("");
  return `${header("Финансовые цели", "", "#/more")}
  <div class="card" style="cursor:default"><div class="card-label">В резерве целей</div><div class="balance-val" style="font-size:24px">${money(savedTotal())}</div>
    <div class="hint">Эта сумма вычитается из «свободного бюджета» на главной.</div></div>
  <div class="history-card">${list || `<div class="empty-text">Целей пока нет</div>`}</div>
  <button class="btn-save" data-act="gnew">＋ Создать цель</button>`;
}

/* ---- должники ---- */
function viewLoans() {
  const active = data.loans.filter(l => l.remainingAmount > 0);
  const closed = data.loans.filter(l => l.remainingAmount <= 0);
  const row = l => `<button class="hist-item" data-act="loan" data-id="${esc(l.id)}"><div class="hist-left"><div class="hist-cat">${esc(l.name)}<span class="tag">${l.isOld ? "старый" : "текущий"}</span></div>
    <div class="hist-sub">из ${money(l.originalAmount)} · ${displayDate(l.date)}</div></div><div class="hist-amount">${money(l.remainingAmount)}</div></button>`;
  return `${header("🤝 Должники", "", "#/more")}
  <div class="card" style="cursor:default"><div class="card-label">Всего должны</div><div class="balance-val" style="font-size:24px">${money(totalOwedToMe())}</div><div class="hint">Активных: ${active.length}</div></div>
  <div class="btn-row"><button class="btn-save" data-act="lnew" style="margin:0">＋ Дать в долг</button><button class="btn-ghost" data-act="lold" style="padding:14px">📌 Старый долг</button></div>
  <div class="history-card">${active.length ? active.map(row).join("") : `<div class="empty-text">Должников нет</div>`}</div>
  ${closed.length ? `<div class="section-label">Погашенные (${closed.length})</div><div class="history-card">${closed.map(row).join("")}</div>` : ""}`;
}
async function createLoan(isOld) {
  const r = await formSheet({
    title: isOld ? "Зафиксировать старый долг" : "Дать в долг",
    message: isOld ? "Долг, который уже был выдан раньше — расход не записывается." : "Сумма будет записана как расход «Дано в долг».",
    fields: [{ key: "name", label: isOld ? "Кто должен?" : "Кому даёшь?", type: "text", required: true }, { key: "amount", label: "Сумма", type: "money" }]
  });
  if (!r || !r.amount) return;
  let transId = null;
  if (!isOld) transId = addTx({ type: "expense", amount: r.amount, section: "Образ жизни и разовые", category: "Дано в долг", note: `Займ: ${r.name}` }).id;
  data.loans.push({ id: makeId(), name: r.name, originalAmount: r.amount, remainingAmount: r.amount, isOld, transactionId: transId, date: new Date().toISOString() });
  saveData(); render(); toast(`Долг зафиксирован: ${r.name} · ${money(r.amount)}`);
}
function loanSheet(id) {
  const l = data.loans.find(x => x.id === id); if (!l) return;
  openSheet(`<h3>Долг: ${esc(l.name)}</h3>
    <div><div class="kv"><span>Остаток</span><span>${money(l.remainingAmount)}</span></div><div class="kv"><span>Было</span><span>${money(l.originalAmount)}</span></div><div class="kv"><span>Дата</span><span>${displayDate(l.date)}</span></div></div>
    ${l.remainingAmount > 0 ? `<button class="btn-save green" data-a="ret" style="margin:0">💰 Вернули долг</button>` : ""}
    <div class="btn-row"><button class="btn-ghost" data-a="edit">✏️ Остаток</button><button class="btn-danger" data-a="del">🗑 Удалить</button></div>`,
    sh => $$("[data-a]", sh).forEach(b => b.onclick = async () => {
      closeSheet();
      if (b.dataset.a === "ret") {
        const r = await formSheet({ title: "Сумма возврата", fields: [{ key: "n", label: "Сколько вернули?", type: "money", value: l.remainingAmount }], okLabel: "Записать" });
        if (!r || !r.n) return;
        const ret = Math.min(r.n, l.remainingAmount);
        l.remainingAmount = Math.round((l.remainingAmount - ret) * 100) / 100;
        addTx({ type: "income", amount: ret, category: "Возврат долга", note: `Возврат от: ${l.name}` });
        saveData(); render(); toast(`Возврат учтён: +${money(ret)}`);
      } else if (b.dataset.a === "edit") {
        const r = await formSheet({ title: "Новый остаток", fields: [{ key: "n", label: "Остаток долга", type: "money", value: l.remainingAmount }] });
        if (r) { l.remainingAmount = r.n; saveData(); render(); }
      } else if (await confirmDlg("Удалить запись о долге?", `${l.name}: ${money(l.remainingAmount)}`)) {
        data.loans = data.loans.filter(x => x.id !== id); saveData(); render();
      }
    }));
}

/* ---- настройки ---- */
function viewSettings() {
  const last = data.lastBackup ? displayDate(data.lastBackup) : "никогда";
  return `${header("Настройки и данные", "", "#/more")}
  <div class="history-card"><div class="history-title" style="margin-bottom:10px">💼 Бюджеты разделов (в месяц)</div>
    ${Object.keys(data.sectionBudgets).map(s => `<div class="form-group" style="margin-bottom:10px"><label class="card-label">${esc(s)}</label><input class="input-box" data-bud="${esc(s)}" type="text" inputmode="decimal" value="${data.sectionBudgets[s]}"></div>`).join("")}
    <div class="hint">Общий лимит: ${money(totalMonthlyBudget())}. «Лимит на сегодня» считается по разделу «Повседневные расходы».</div></div>
  <div class="history-card"><div class="history-title" style="margin-bottom:10px">💰 Стартовый баланс</div>
    <input class="input-box" id="init-bal" type="text" inputmode="decimal" value="${data.initialBalance}"></div>
  <div class="history-card"><div class="history-header"><div class="history-title">⚡ Шаблоны быстрых трат</div><button class="history-link" data-act="tadd">＋ Добавить</button></div>
    ${data.templates.map(t => `<button class="hist-item" data-act="tedit" data-id="${esc(t.id)}"><div class="hist-left"><div class="hist-cat">${esc(t.name)}</div><div class="hist-sub">${esc(t.category)}</div></div><div class="hist-amount">${money(t.amount)}</div></button>`).join("") || `<div class="empty-text">Нет шаблонов</div>`}</div>
  <div class="history-card"><div class="history-title" style="margin-bottom:4px">🛟 Данные</div>
    <div class="hint" style="margin-bottom:10px">Всё хранится только в этом браузере на этом устройстве. Последняя копия: ${last}. Операций: ${data.transactions.length}.</div>
    <div class="btn-row" style="margin-bottom:8px"><button class="btn-ghost" data-act="export-json">🛟 Бэкап JSON</button><button class="btn-ghost" data-act="export-csv">📊 Экспорт CSV</button></div>
    <button class="btn-ghost" data-act="import" style="width:100%;margin-bottom:8px">♻️ Восстановить / импорт из JSON</button>
    <button class="btn-danger" data-act="wipe" style="width:100%">Стереть все данные</button></div>
  <div class="hint" style="text-align:center;padding:4px 0 8px">Money Radar · веб-версия</div>`;
}
function exportCsv() {
  let csv = "﻿ID;Дата;Тип;Раздел;Категория;Сумма;Примечание\n";
  for (const t of data.transactions) csv += `${t.id};${displayDate(t.date)};${t.type === "income" ? "Доход" : "Расход"};${t.section || "—"};${t.category};${t.amount};"${(t.note || "").replace(/"/g, '""')}"\n`;
  download(`MoneyRadar_${dateKey(new Date())}.csv`, csv, "text/csv");
}
function exportJson() {
  data.lastBackup = new Date().toISOString(); saveData();
  download(`MoneyRadar_Backup_${dateKey(new Date())}.json`, JSON.stringify(data, null, 2), "application/json");
  render();
}
$("#file-json").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const parsed = JSON.parse(await f.text());
    if (!parsed || typeof parsed !== "object" || !Array.isArray(parsed.transactions)) throw new Error("это не бэкап Money Radar");
    const next = normalize(parsed);
    const ok = await confirmDlg("Заменить текущие данные?", `В файле: ${next.transactions.length} операций, ${next.loans.length} долгов, ${next.goals.length} целей.\nСейчас в приложении: ${data.transactions.length} операций. Они будут заменены.`, "Заменить", true);
    if (!ok) return;
    next.lastBackup = parsed.lastBackup || null; data = next; saveData(); render(); toast("Данные восстановлены");
  } catch (err) { toast("Ошибка импорта: " + (err.message || err)); }
});
$("#file-img").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) ocrFile(f); });

/* ============ РОУТЕР И РЕНДЕР ============ */
function parseHash() {
  const h = location.hash.replace(/^#\/?/, ""), [path, qs] = h.split("?");
  const q = {}; new URLSearchParams(qs || "").forEach((v, k) => q[k] = v);
  return { path: path || "", q };
}
const TABS = [["", "🏠", "Главная"], ["history", "🧾", "История"], ["add", "+", ""], ["analytics", "📊", "Аналитика"], ["more", "☰", "Ещё"]];
function renderTabs(path) {
  const group = { "": "", history: "history", analytics: "analytics", more: "more", recurring: "more", goals: "more", loans: "more", settings: "more", add: "add" }[path] ?? "";
  $("#tabbar").innerHTML = TABS.map(([p, ic, l]) => p === "add"
    ? `<a class="fab" href="#/add?fresh=1" aria-label="Добавить">+</a>`
    : `<a class="tab ${group === p ? "on" : ""}" href="#/${p}"><span class="ic">${ic}</span>${l}</a>`).join("");
}
function render(keepScroll) {
  const { path, q } = parseHash();
  const y = window.scrollY;
  if (path !== "add" && form && !form.editId) { /* форму оставляем, чтобы вернуться */ }
  const views = { "": viewDashboard, analytics: viewAnalytics, history: viewHistory, add: () => viewAdd(q), more: viewMore, recurring: viewRecurring, goals: viewGoals, loans: viewLoans, settings: viewSettings };
  $("#app").innerHTML = (views[path] || viewDashboard)();
  renderTabs(path);
  if (keepScroll) window.scrollTo(0, y);
  if (path === "add") afterAdd(q);
  if (path === "history") bindHistory();
  if (path === "settings") bindSettings();
}
let lastRouteKey = "";
window.addEventListener("hashchange", () => {
  closeSheet();
  const key = location.hash; if (key !== lastRouteKey) { lastRouteKey = key; render(); window.scrollTo(0, 0); }
});

function afterAdd(q) {
  if (q.fresh) { history.replaceState(null, "", "#/add"); lastRouteKey = "#/add"; }
  const amt = $("#in-amount");
  if (q.voice && !form._voiceDone) { form._voiceDone = true; setTimeout(startVoice, 150); }
  else if (q.smart && !form._smartDone) { form._smartDone = true; $("#smart")?.focus(); }
  else if (!form.amount && !form.editId && !matchMedia("(pointer:coarse)").matches) amt?.focus();
  const note = $("#in-note");
  if (note) note.addEventListener("input", () => {
    if (form.catTouched) return;
    const low = note.value.toLowerCase().replace(/ё/g, "е");
    const rule = SMART_RULES.find(r => r.type === form.type && r.keywords.some(k => low.includes(k.toLowerCase())));
    if (rule) { form.category = rule.category; $("#cats").innerHTML = pillsHtml(); }
  });
  $("#smart")?.addEventListener("input", e => form.raw = e.target.value);
}
function bindHistory() {
  const hq = $("#hq");
  hq.addEventListener("input", () => { ui.histQ = hq.value; $("#hlist").innerHTML = historyListHtml(); });
  $("#hm").addEventListener("change", e => { ui.histMonth = e.target.value; $("#hlist").innerHTML = historyListHtml(); });
}
function bindSettings() {
  $$("[data-bud]").forEach(i => i.addEventListener("change", () => {
    const n = parseNum(i.value); if (!Number.isFinite(n) || n < 0) { i.value = data.sectionBudgets[i.dataset.bud]; return; }
    data.sectionBudgets[i.dataset.bud] = n; saveData(); toast("Лимит обновлён");
  }));
  $("#init-bal").addEventListener("change", e => {
    const n = parseNum(e.target.value); if (!Number.isFinite(n)) { e.target.value = data.initialBalance; return; }
    data.initialBalance = n; saveData(); toast("Стартовый баланс сохранён");
  });
}

/* ============ ДЕЛЕГИРОВАНИЕ КЛИКОВ ============ */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  switch (act) {
    case "tx": showTx(id); break;
    case "tpl": {
      const t = data.templates.find(x => x.id === id); if (!t) break;
      const tx = addTx({ type: "expense", amount: t.amount, section: t.section, category: t.category, note: t.name });
      render(true);
      toast(`Записано: −${money(t.amount)} · ${t.name}`, { label: "Отменить", fn: () => { data.transactions = data.transactions.filter(x => x.id !== tx.id); saveData(); render(true); } });
      break; }
    case "import": $("#file-json").click(); break;
    case "export-json": exportJson(); break;
    case "export-csv": exportCsv(); break;
    case "wipe":
      if (await confirmDlg("Стереть все данные?", "Это удалит все операции, долги, цели и настройки в этом браузере. Сначала сделайте бэкап.", "Стереть")) { data = defaultData(); saveData(); render(); toast("Данные стёрты"); }
      break;
    case "mprev": ui.anMonth = shiftMonth(ui.anMonth, -1); render(); break;
    case "mnext": ui.anMonth = shiftMonth(ui.anMonth, 1); render(); break;
    case "htype": ui.histType = v; render(true); break;
    case "type": readForm(); form.type = v; form.category = ""; form.catTouched = false; render(true); break;
    case "cat": form.category = v; form.catTouched = true; $("#cats").innerHTML = pillsHtml(); break;
    case "parse": { const t = $("#smart").value.trim(); if (t) runParse(t); else $("#smart-status").textContent = "Введите или вставьте текст"; break; }
    case "voice": startVoice(); break;
    case "photo": $("#file-img").click(); break;
    case "submit": submitForm(); break;
    case "split": splitFlow(); break;
    case "radd": recurringForm(null); break;
    case "redit": {
      const r = data.recurring.find(x => x.id === id); if (!r) break;
      openSheet(`<h3>${esc(r.name)}</h3><div class="btn-row"><button class="btn-ghost" data-a="e">✏️ Изменить</button><button class="btn-danger" data-a="d">🗑 Удалить</button></div>`,
        sh => $$("[data-a]", sh).forEach(b => b.onclick = async () => { closeSheet(); if (b.dataset.a === "e") recurringForm(r); else if (await confirmDlg("Удалить платёж?", `${r.name} · ${money(r.amount)}`)) { data.recurring = data.recurring.filter(x => x.id !== id); saveData(); render(); } }));
      break; }
    case "rpay": {
      const r = data.recurring.find(x => x.id === id); if (!r) break;
      const res = await formSheet({ title: `Оплатить: ${r.name}`, fields: [{ key: "amount", label: "Сумма оплаты", type: "money", value: r.amount }], okLabel: "Записать расход" });
      if (!res || !res.amount) break;
      addTx({ type: "expense", amount: res.amount, section: r.section, category: r.category, note: r.name, recurringId: r.id });
      render(); toast(`Оплачено: ${r.name} · ${money(res.amount)}`);
      break; }
    case "gnew": {
      const r = await formSheet({ title: "Новая цель", fields: [{ key: "name", label: "Название цели", type: "text", required: true }, { key: "target", label: "Сумма цели", type: "money" }, { key: "saved", label: "Уже накоплено", type: "money", value: 0 }] });
      if (r && r.target > 0) { data.goals.push({ id: makeId(), name: r.name, target: r.target, saved: r.saved }); saveData(); render(); }
      break; }
    case "gadd": {
      const g = data.goals.find(x => x.id === id); if (!g) break;
      const r = await formSheet({ title: `Пополнить: ${g.name}`, message: `Накоплено ${money(g.saved)} из ${money(g.target)}`, fields: [{ key: "n", label: "Сумма пополнения", type: "money" }], okLabel: "Пополнить" });
      if (r && r.n) { g.saved += r.n; saveData(); render(); }
      break; }
    case "gedit": {
      const g = data.goals.find(x => x.id === id); if (!g) break;
      const r = await formSheet({ title: "Изменить цель", fields: [{ key: "name", label: "Название", type: "text", value: g.name, required: true }, { key: "target", label: "Сумма цели", type: "money", value: g.target }, { key: "saved", label: "Накоплено", type: "money", value: g.saved }],
        extra: `<button class="btn-danger" data-x="del">🗑 Удалить цель</button>` });
      if (r && r.__x === "del") { if (await confirmDlg("Удалить цель?", `${g.name} · ${money(g.saved)} из ${money(g.target)}`)) { data.goals = data.goals.filter(x => x.id !== id); saveData(); render(); } }
      else if (r) { Object.assign(g, { name: r.name, target: r.target, saved: r.saved }); saveData(); render(); }
      break; }
    case "lnew": createLoan(false); break;
    case "lold": createLoan(true); break;
    case "loan": loanSheet(id); break;
    case "tadd":
    case "tedit": {
      const t = act === "tedit" ? data.templates.find(x => x.id === id) : null;
      const r = await formSheet({ title: t ? "Изменить шаблон" : "Новый шаблон", fields: [
        { key: "name", label: "Название", type: "text", value: t?.name || "", required: true },
        { key: "amount", label: "Сумма", type: "money", value: t?.amount ?? "" },
        { key: "category", label: "Категория", type: "select", options: Object.values(EXPENSE_GROUPS).flat(), value: t?.category || "Продукты" }],
        extra: t ? `<button class="btn-danger" data-x="del">🗑 Удалить шаблон</button>` : "" });
      if (r && r.__x === "del") { data.templates = data.templates.filter(x => x.id !== id); saveData(); render(); break; }
      if (r) { const rec = { name: r.name, amount: r.amount, category: r.category, section: resolveSection(r.category) }; if (t) Object.assign(t, rec); else data.templates.push({ id: makeId(), ...rec }); saveData(); render(); }
      break; }
  }
});
/* ============ СТАРТ ============ */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
lastRouteKey = location.hash;
render();
</script>
</body>
</html>
